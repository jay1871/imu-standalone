# ADIS16607-2 IMU Simulation Parameters
# Source: ADIS16607 Rev. 0 (Draft) 2026-08-17 Datasheet, Table 1 & Allan Deviation Plots
# All values stored in SI units as expected by ImuSimulator
#
# ============================================================================
# UNIT CONVERSION REFERENCE
# ============================================================================
#   deg/sqrt(hr) -> rad/s^(1/2): multiply by (pi/180) / sqrt(3600) = pi/10800
#   deg/hr -> rad/s:             multiply by (pi/180) / 3600 = pi/648000
#   deg/sec -> rad/s:            multiply by pi/180
#   mg -> m/s^2:                 multiply by 9.797464e-3
#   ug -> m/s^2:                 multiply by 9.797464e-6
#   m/sec/sqrt(hr) -> m/s^(3/2): multiply by 1/sqrt(3600) = 1/60
#
# NOTE ON BIAS INSTABILITY (B):
#   The datasheet reports "In-Run Bias Stability" which is the MINIMUM of the
#   Allan deviation curve. The B coefficient used in the NBK Gauss-Markov model
#   relates to this as:
#       B_coefficient = bias_stability_allan_min / 0.6645
#   because sigma_min = B * sqrt(2*ln2/pi) ≈ B * 0.6645
# ============================================================================

imu_simulator:
  # ******************************************************************
  # General Settings
  # ******************************************************************
  general_settings:
    sample_time: 0.001          # (s) 1000 Hz output rate (ADIS16607 Direct Input Sync)
    seed: 42                    # positive = deterministic (repeatable), -1 = truly random

  # ******************************************************************
  # Model Parameter Settings
  # ******************************************************************
  model_parameter_settings:
    # **************** Accelerometer Model Parameters ****************
    accelerometer:
      # Velocity Random Walk (VRW) - fitted to real-world hardware measurements (47 DUTs, tau <= 1e4 s)
      # Datasheet: 0.045 m/sec/sqrt(hr) (X,Y), 0.042 m/sec/sqrt(hr) (Z)
      # Measured 47-DUT fit: 0.0436 m/sec/sqrt(hr) (X), 0.0423 m/sec/sqrt(hr) (Y), 0.0406 m/sec/sqrt(hr) (Z)
      # SI: VRW / sqrt(3600) = VRW / 60
      N: [7.2625e-04, 7.0562e-04, 6.7700e-04]  # (m/s^(3/2))

      # Bias Instability - nominal single-pole fallback (m/s^2)
      B: [8.3985e-05, 8.2582e-05, 1.5523e-04]  # (m/s^2)

      # Acceleration Random Walk - fitted to real-world hardware measurements (long-tau +1/2 slope)
      K: [5.5124e-06, 5.4944e-06, 5.7125e-06]  # (m/s^(5/2))

      # Gauss-Markov correlation time - nominal single-pole fallback (s)
      correlation_time: [107.7, 106.1, 88.7]  # (s)

      # Multi-pole Gauss-Markov bank (3 poles per axis) for hump-free 1/f flicker floor
      # Fitted to 47-DUT hardware measurements over tau in [0.5, 10^4] s (< 0.25% RMS error)
      B_poles:
        - [5.4098e-05, 5.8207e-05, 1.2322e-04]  # X-axis poles (m/s^2)
        - [5.2901e-05, 5.4878e-05, 9.2599e-05]  # Y-axis poles (m/s^2)
        - [1.0152e-04, 1.0658e-04, 1.5937e-04]  # Z-axis poles (m/s^2)
      correlation_time_poles:
        - [20.33, 250.43, 4305.93]      # X-axis correlation times (s)
        - [21.63, 205.52, 2165.97]      # Y-axis correlation times (s)
        - [14.77, 130.93, 1904.57]      # Z-axis correlation times (s)

      # Optional part-to-part (DUT-to-DUT) 1-sigma parameter spread from real-world measurements
      # Only used when compiled with ENABLE_DUT_PARAMETER_SPREAD defined:
      N_std: [2.6236e-05, 2.4620e-05, 2.5051e-05]  # (m/s^(3/2))
      B_std: [1.4962e-05, 1.4589e-05, 3.0431e-06]  # (m/s^2)
      correlation_time_std: [50.0, 50.0, 50.0]  # (s)

      # Turn-on bias interval - from datasheet "Initial Bias Error"
      # Datasheet: +/-2.5 mg
      # SI: 2.5e-3 * 9.797464 = 2.4494e-2 m/s^2
      interval_turn_on_bias: [2.4494e-2, 2.4494e-2, 2.4494e-2]  # (m/s^2)

      # Measurement range - from datasheet "Dynamic Range"
      # Datasheet: +/-40g
      # SI: 40 * 9.797464 = 391.899 m/s^2
      measurement_range: [391.899, 391.899, 391.899]  # (m/s^2)

      # Scale factor interval - from datasheet "Initial Sensitivity Error"
      # Datasheet: +/-0.04%
      interval_scale_factor: [0.04, 0.04, 0.04]  # (%)

      # Misalignment interval - from datasheet "Axis-to-Axis Orthogonality Error"
      # Datasheet: +/-0.02 degrees
      # SI: 0.02 * pi/180 = 3.4907e-4 rad
      interval_misalignment: [3.4907e-4, 3.4907e-4, 3.4907e-4]  # (rad)

      # Non-orthogonality interval (6 axis pairs)
      # Same source as misalignment: +/-0.02 degrees = 3.4907e-4 rad
      interval_non_orthogonality: [3.4907e-4, 3.4907e-4, 3.4907e-4, 3.4907e-4, 3.4907e-4, 3.4907e-4]  # (rad)

      # Resolution (quantization) - from datasheet "Sensitivity" (24-bit mode)
      # Datasheet: 200000 LSB/g -> resolution = 1/200000 g
      # SI: (1/200000) * 9.797464 = 4.899e-5 m/s^2/LSB
      resolution: [4.899e-5, 4.899e-5, 4.899e-5]  # (m/s^2/LSB)

    # ****************** Gyroscope Model Parameters ******************
    gyroscope:
      # Angular Random Walk (ARW) - fitted to real-world hardware measurements (33 DUTs, tau <= 1e4 s)
      # Measured 33-DUT fit: 0.177 deg/sqrt(hr) (X), 0.165 deg/sqrt(hr) (Y), 0.075 deg/sqrt(hr) (Z)
      # SI: ARW * pi / 10800
      N: [5.1501e-05, 4.7935e-05, 2.1821e-05]  # (rad/s^(1/2))

      # Bias Instability - nominal single-pole fallback (rad/s)
      B: [7.1595e-06, 1.2507e-05, 6.7685e-06]  # (rad/s)

      # Rate Random Walk - matched to real-world hardware measurements long-tau tail (2000s - 10000s)
      K: [1.2358e-07, 2.1677e-07, 1.0478e-07]  # (rad/s^(3/2))

      # Gauss-Markov correlation time - nominal single-pole fallback (s)
      correlation_time: [515.7, 118.7, 144.0]  # (s)

      # Multi-pole Gauss-Markov bank (3 poles per axis) for hump-free 1/f flicker floor
      # Fitted to 33-DUT hardware measurements over tau in [0.5, 10^4] s (< 0.4% RMS error)
      B_poles:
        - [5.5083e-06, 5.1217e-06, 4.9446e-06]  # X-axis poles (rad/s)
        - [8.5087e-06, 8.2528e-06, 1.0141e-05]  # Y-axis poles (rad/s)
        - [4.6124e-06, 4.5869e-06, 5.6792e-06]  # Z-axis poles (rad/s)
      correlation_time_poles:
        - [23.80, 196.13, 1576.73]      # X-axis correlation times (s)
        - [17.16, 165.12, 1339.84]      # Y-axis correlation times (s)
        - [13.22, 134.12, 1532.73]      # Z-axis correlation times (s)

      # Optional part-to-part (DUT-to-DUT) 1-sigma parameter spread from real-world measurements
      # Only used when compiled with ENABLE_DUT_PARAMETER_SPREAD defined:
      N_std: [4.8590e-06, 2.8285e-06, 1.5219e-06]  # (rad/s^(1/2))
      B_std: [1.3046e-06, 5.8257e-06, 2.9195e-06]  # (rad/s)
      K_std: [4.3191e-08, 1.5303e-07, 7.3379e-08]  # (rad/s^(3/2))
      correlation_time_std: [250.0, 250.0, 194.5]  # (s)

      # Turn-on bias interval - from datasheet "Initial Bias Error"
      # Datasheet: +/-0.2 deg/sec
      # SI: 0.2 * pi/180 = 3.4907e-3 rad/s
      interval_turn_on_bias: [3.4907e-3, 3.4907e-3, 3.4907e-3]  # (rad/s)

      # Measurement range - from datasheet "Dynamic Range"
      # Datasheet: +/-480 deg/sec (ADIS16607-2 typical)
      # SI: 480 * pi/180 = 8.3776 rad/s
      measurement_range: [8.3776, 8.3776, 8.3776]  # (rad/s)

      # Scale factor interval - from datasheet "Initial Sensitivity Error"
      # Datasheet: +/-0.2% (ADIS16607-2)
      interval_scale_factor: [0.2, 0.2, 0.2]  # (%)

      # Misalignment interval - from datasheet "Axis-to-Axis Orthogonality Error"
      # Datasheet: +/-0.02 degrees
      # SI: 0.02 * pi/180 = 3.4907e-4 rad
      interval_misalignment: [3.4907e-4, 3.4907e-4, 3.4907e-4]  # (rad)

      # Non-orthogonality interval (6 axis pairs)
      interval_non_orthogonality: [3.4907e-4, 3.4907e-4, 3.4907e-4, 3.4907e-4, 3.4907e-4, 3.4907e-4]  # (rad)

      # Resolution (quantization) - from datasheet "Sensitivity" (24-bit mode)
      # Datasheet: 16000 LSB/(deg/sec) -> resolution = 1/16000 deg/sec
      # SI: (1/16000) * pi/180 = 1.0908e-6 rad/s/LSB
      resolution: [1.0908e-6, 1.0908e-6, 1.0908e-6]  # (rad/s/LSB)

  # ******************************************************************
  # Model Enable Settings
  # ******************************************************************
  model_enable_settings:
    accelerometer:
      enable_local_ref_vec: true
      enable_turn_on_bias: true
      enable_scaling: true
      enable_misalignment: true
      enable_stochastic_error: true
      enable_saturation: true
      enable_quantization: true

    gyroscope:
      enable_local_ref_vec: true
      enable_turn_on_bias: true
      enable_scaling: true
      enable_misalignment: true
      enable_stochastic_error: true
      enable_saturation: true
      enable_quantization: true

  # ******************************************************************
  # Environment Settings
  # ******************************************************************
  environmental_settings:
    # Wilmington, MA (ADI headquarters) - adjust to your test location
    start_geo_position_llh: [42.5584, -71.1765, 50.0]  # (deg, deg, m)
    start_geo_velocity_ned: [0.0, 0.0, 0.0]  # (m/s)
